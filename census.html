<div id="dash-root">
<!-- The Population Census page (foreverinfo.io/census): who plays which race and class, from Raider.IO's census.
     census.py wraps this in the Sims page's frame (experiment.CSS: colours, fonts, background, the Home button and the
     corner stamp) and fills window.__CENSUS from census.json. Laid out like the Sims page's DPS tab: a ranking box of the
     classes (clicking a class shows its races in the same box), a ranking box of the races (clicking a race shows its
     classes), each with a breadcrumb back and the browser's Back closing it, then the race x class table, drawn and
     sorted like the Sims page's "DPS by Race and Spec". The boxes copy experiment/page.html's look (.rr-card, .rr-seg,
     .rr-tip, its ranking chart and its .lx-matrix table). -->
<style>
  .cz { --al: #3f7fd9; --ho: #d2423b; --gold: #e2b23c; --accent: #5b9bd5; display: flex; flex-direction: column; gap: var(--cds-gap-lg); color: var(--color-fg); }
  .cz p { margin: 0; }
  .cz a { color: #ffd100; text-underline-offset: 2px; }
  .cz-note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.45; }

  /* along the top, on the background picture: the faction crests (pick one to show only its races, again for all), as
     the Sims page, then the region flags and the ruleset icons, each group in a small panel */
  .cz-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm) var(--cds-gap-md); padding: var(--cds-pad-xs) 2px; margin-bottom: calc(var(--cds-gap-md) - var(--cds-gap-lg)); }
  .cz-fac { display: flex; gap: var(--cds-gap-sm); }
  .cz-fac button { width: 32px; height: 32px; padding: 0; margin: 0; cursor: pointer; border: 2px solid #000; border-radius: 4px; overflow: hidden; background: #111;
    box-shadow: 0 0 0 1px #8a6a2a, 0 3px 8px #000c; transition: box-shadow .15s, filter .15s; }
  .cz-fac button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cz-fac button:hover { filter: brightness(1.15); }
  .cz-fac button[aria-pressed="true"] { box-shadow: 0 0 0 2px #ffd75a, 0 0 10px #ffd75a99, 0 3px 8px #000c; }
  .cz-fac button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 3px; }
  .cz-fac button:disabled { filter: grayscale(1) brightness(.45); cursor: default; }   /* a ruleset the region has no realms of (Korea, Taiwan: no RP) */
  /* each group (regions, factions, rulesets) in a small panel, styled as the page's cards */
  .cz-top > .cz-fac { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 6px; }
  @media (max-width: 600px) { .cz-fac button { width: 28px; height: 28px; } }
  /* the region buttons (first in the row) are the crests' buttons around each region's square flag (images/flags, drawn by art/flags.py) */

  .cz-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
  .cz-seg button { font: inherit; font-size: var(--cds-font-size-caption); padding: var(--cds-pad-xs) var(--cds-pad-sm); background: var(--color-bg); color: var(--color-fg);
    border: 0; border-right: 1px solid var(--color-border-line); cursor: pointer; }
  .cz-seg button:last-child { border-right: 0; }
  .cz-seg button[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); }
  .cz-seg button:disabled { color: var(--color-fg-muted); opacity: .45; cursor: default; }
  .cz button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -3px; }

  .cz-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg);
    display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; }
  .cz-cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--cds-gap-sm); }
  /* a box's count line, with the levels switch (All / 60) at its right; every box's switch is the same one */
  .cz-small { color: #e2b23c; }   /* "small sample" after a thin pick's count */
  @media (max-width: 600px) { .cz-card { padding: 10px; } }

  /* an open breakdown's breadcrumb: "Classes › Paladin", the first part going back to the whole list */
  .cz-crumbs { display: flex; align-items: center; font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); line-height: 24px; }   /* every part on one centre line, the All / 60 Only switch's */
  .cz-crumb { font: inherit; border: 0; background: none; padding: 0; color: var(--color-fg-muted); cursor: pointer; }
  .cz-root { color: var(--color-fg); }
  .cz-count { color: var(--color-fg-muted); font-weight: 400; margin-left: .35em; white-space: pre; }   /* "(NA-PvP-Alliance) 473,962" after the title */
  .cz-crumb:hover { color: var(--color-fg); text-decoration: underline; text-underline-offset: 3px; }
  .cz-crumbsep { color: var(--color-fg-muted); margin: 0 .35em; font-weight: 400; font-size: 1.4em; line-height: 1; position: relative; top: -.06em; }
  .cz-crumbs img { width: 1em; height: 1em; border-radius: 3px; margin-right: .4em; flex: none; }   /* as tall as the text */
  /* the picked class or race: a button opening a menu of the others (the Sims page's .rr-pick and .rr-menu) */
  .cz-pickwrap { position: relative; display: flex; }
  .cz-pick { font: inherit; display: inline-flex; align-items: center; padding: 0 .3em; margin: 0 -.3em; border: 0; border-radius: var(--cds-radius); background: none; cursor: pointer; }
  .cz-pick:hover, .cz-pick[aria-expanded="true"] { background: color-mix(in srgb, var(--color-fg) 10%, transparent); }

<script>
(() => {
const C = window.__CENSUS;
const RACES = C.races, CLASSES = C.classes;
const FACTION = (i) => i < 5 ? 'Alliance' : 'Horde';
const RACE_ICON = ['race_human_male', 'race_dwarf_male', 'race_nightelf_female', 'race_gnome_female', 'race_bloodelf_male_tbc',
  'race_orc_male', 'race_scourge_male', 'race_tauren_male', 'race_troll_male', 'race_bloodelf_female_skyborne'];
// the race's plural, for "Of Night Elves"
const RACE_PL = ['Humans', 'Dwarves', 'Night Elves', 'Gnomes', 'High Order Skyborne', 'Orcs', 'Undead', 'Tauren', 'Trolls', 'Windshaper Skyborne'];
// WoW class colours (as the Sims page); bars and headers soften them toward the text colour, as its specColor
const CLASS_COLOR = { Druid: '#FF7C0A', Hunter: '#AAD372', Mage: '#3FC7EB', Paladin: '#F48CBA', Priest: '#FFFFFF', Rogue: '#FFF468', Shaman: '#0070DD', Warlock: '#8788EE', Warrior: '#C69B6D' };
const soft = (c) => `color-mix(in srgb, ${c} 85%, var(--color-fg))`;
const FAC_COLOR = { Alliance: 'var(--al)', Horde: 'var(--ho)' }, FAC_TEXT = { Alliance: '#74a9ff', Horde: '#ff6d5f' };
const REGIONS = [['all', 'All regions'], ['us', 'Americas'], ['eu', 'Europe'], ['kr', 'Korea'], ['tw', 'Taiwan']];
const RULES = [['', 'All rulesets', 'all'], ['Normal', 'Normal', 'normal'], ['PvP', 'PvP', 'pvp'], ['Roleplay', 'RP', 'rp'], ['Roleplay PvP', 'RP-PvP', 'rppvp']];
const METRICS = [['col', '% of class'], ['row', '% of race'], ['all', '% of all'], ['n', 'Characters']];
const raceImg = (i) => `<img class="race ${FACTION(i)}${i === 4 ? ' mirror' : ''}" src="images/icons/${RACE_ICON[i]}.jpg" alt="">`;
const classImg = (j) => `<img src="images/icons/classicon_${CLASSES[j].toLowerCase()}.jpg" alt="">`;
const fmt = (n) => n.toLocaleString('en-US');
const pct = (a, b) => b ? a / b * 100 : 0;
const pctTxt = (v) => v === 0 ? '0%' : v.toFixed(1) + '%';
const $ = (id) => document.getElementById(id);

// The filters live in the address (/census?eu,pvp,horde), so a link or a reload keeps them. An open breakdown doesn't:
// as on the Sims page, a reload starts on the full lists.
const LV_TOKENS = [['cls', 'classes60'], ['race', 'races60'], ['table', 'table60']];
const S = { region: 'all', rules: '', faction: '', level: { cls: 'all', race: 'all', table: 'all' }, cls: -1, race: -1, metric: 'col', sort: null, sortDir: 'desc', colRace: -1 };
for (const t of location.search.slice(1).toLowerCase().split(/[,&+]/).filter(Boolean)) {
  // each box has its own All / 60 Only switch: "60" in the link puts all three at level 60, "classes60" one box
  if (t === '60') { for (const b in S.level) S.level[b] = '60'; continue; }
  const lb = LV_TOKENS.find(([, tok]) => tok === t); if (lb) { S.level[lb[0]] = '60'; continue; }
  if (REGIONS.some(([k]) => k === t && k !== 'all')) { S.region = t; continue; }
  const ru = RULES.find((r) => r[2] === t && r[0]); if (ru) { S.rules = ru[0]; continue; }
  if (t === 'alliance' || t === 'horde') S.faction = t[0].toUpperCase() + t.slice(1);
}
const link = () => {
  const parts = [];
  if (S.region !== 'all') parts.push(S.region);
  if (S.rules) parts.push(RULES.find((r) => r[0] === S.rules)[2]);
  if (S.faction) parts.push(S.faction.toLowerCase());
  if (Object.values(S.level).every((v) => v === '60')) parts.push('60');
  else for (const [b, tok] of LV_TOKENS) if (S.level[b] === '60') parts.push(tok);
  return location.pathname + (parts.length ? '?' + parts.join(',') : '');
};

// Opening a breakdown (a class's races, a race's classes) adds a history entry, so the browser's Back closes it, as on
// the Sims page; closing it from the page (its breadcrumb) uses that entry up again. open lists the boxes opened, last
// one last; a reload (which keeps an entry's marker) starts clean.
const open = [];
if (history.state && history.state.cz) history.replaceState(null, '', location.href);
const show = (box, idx) => {
  const was = S[box] >= 0; S[box] = idx;
  if (!was) { open.push(box); history.pushState({ cz: box }, '', location.href); }
  draw();
};
const hide = (box) => {
  if (S[box] < 0) return;
  if (open[open.length - 1] === box && history.state && history.state.cz === box) { history.back(); return; }   // popstate closes it
  S[box] = -1; open.splice(open.indexOf(box), 1); draw();
};
addEventListener('popstate', () => { const box = open.pop(); if (box) { S[box] = -1; draw(); } });

const has = (region, rules) => !!C.counts[rules ? region + '|' + rules : region];
const raceOn = (i) => !S.faction || FACTION(i) === S.faction;
// the counts in view, [class][race], with the other faction's races zeroed
const counts = (lv) => (lv === '60' ? C.counts60 : C.counts)[S.rules ? S.region + '|' + S.rules : S.region];   // all levels (10-60) or level 60 only
const grid = (lv) => counts(lv).map((row) => row.map((n, i) => raceOn(i) ? n : 0));
// which race / class combinations exist at all (any count anywhere)
const EXISTS = CLASSES.map((_, j) => RACES.map((_, i) => C.counts.all[j][i] > 0));
const argmax = (a) => a.reduce((b, v, i) => v > a[b] ? i : b, 0);

function segs(el, items, cur, onPick, disabled = () => false) {
  el.innerHTML = items.map(([v, label]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}"${disabled(v) ? ' disabled' : ''}>${label}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('button'); if (b && !b.disabled) onPick(b.dataset.v); };
}

// tooltips: each row and cell keeps its tooltip's HTML in tips[key]
const tips = {}, tip = $('czTip');
const tipRows = (rows) => rows.map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
// On a phone a tap fires one mousemove: a tapped bar or cell shows its tooltip until the next touch or scroll, and the
// filter icons show none (the icon's own look already says it's picked)
let touched = 0;
document.addEventListener('touchstart', () => { touched = Date.now(); tip.hidden = true; }, { passive: true });
addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  if (!el || !tips[el.dataset.tip] || (Date.now() - touched < 1500 && el.closest('.cz-top'))) { tip.hidden = true; return; }
  tip.innerHTML = tips[el.dataset.tip]; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';

// a ranking chart: items {key, name, nameColor, color (bar), img, n, top (the label's most played race or class), onClick}
function rank(el, items, sum) {
  const shown = items.filter((d) => d.ok !== false).sort((a, b) => b.n - a.n);
  if (!shown.length || !sum) { el.innerHTML = '<p class="cz-empty">No characters for this pick.</p>'; el.onclick = null; return; }
  const maxPct = Math.max(...shown.map((d) => pct(d.n, sum)));
  // the axis: a round step giving about four to six gridlines
  const step = [1, 2, 5, 10, 20, 25, 50].find((s) => maxPct / s <= 6) || 50;
  const ticks = []; for (let t = 0; t <= maxPct + 1e-9; t += step) ticks.push(t);
  const x = (v) => `calc((100% - var(--lab) - var(--mvw, 0rem)) * ${(v / maxPct).toFixed(4)})`;
  el.classList.toggle('cz-hastop', shown.some((d) => d.top));
  el.classList.toggle('cz-hasmv', shown.some((d) => d.mv));   // more room for the bar's label when it names the top pick (a class, not an inline
  // style, so the phone widths' smaller room still applies)
  el.innerHTML = '<div class="cz-grid">' + ticks.map((t) => `<i style="left:${x(t)}"></i><span style="left:${x(t)}">${t}%</span>`).join('') + '</div>'
    + shown.map((d) => {
      const p = pct(d.n, sum), tag = d.onClick ? 'button' : 'div';
      return `<${tag}${d.onClick ? ' type="button"' : ''} class="cz-row${d.n ? '' : ' dim'}" data-k="${d.key}" data-tip="${d.key}"><span class="nm">${d.img}<b style="color:${d.nameColor || 'var(--color-fg)'}">${d.name}</b></span>`
        + `<span class="bar"><i style="width:${x(p)};background:${soft(d.color)}"></i><span class="p">${pctTxt(p)}</span>${d.mv || ''}<span class="c">${fmt(d.n)}</span>`
        + (d.top ? `<span class="top">${d.top.img}<span>${d.top.name}</span></span>` : '') + `</span></${tag}>`;
    }).join('') + '<div class="cz-axis"></div>';

// Rising / falling since last week (Raider.IO's weekly history, census.json's prev): the share now against the share

const MV_MIN = 0.2, MV_N = 1000;

// {html, row}: the arrow after the bar's share, and a tooltip row with last week's share ('' and null when none)
function move(now, nowTot, was, wasTot, week) {
  if (!week || nowTot < MV_N || wasTot < MV_N) return { html: '', row: null };
  const a = pct(now, nowTot), b = pct(was, wasTot), dv = Math.round((a - b) * 10) / 10;
  const row = [weekTxt(week), pctTxt(b)];
  if (Math.abs(dv) < MV_MIN) return { html: '', row };

}
// An open breakdown's title: the list's name (back to it), then the picked class or race, which opens a menu of all of

function draw() {

        ...(mv.row ? [mv.row] : []), ['Most played race', g[j][tr] ? `${RACES[tr]} (${pctTxt(pct(g[j][tr], classTot[j]))})` : '–']]);

// The race x class table, as the Sims page's "DPS by Race and Spec": each cell shaded by where it sits in its column
// (palest to darkest blue), the column's biggest in bold with a gold mark. A class's header sorts the races by it
// (again to flip, a third time for the usual order); a race orders the classes by its own numbers, biggest first.
function table(g, raceTot, classTot, total) {
  const val = (j, i) => {
    const n = g[j][i];
    return S.metric === 'col' ? pct(n, classTot[j]) : S.metric === 'row' ? pct(n, raceTot[i]) : S.metric === 'all' ? pct(n, total) : n;
  };
  const allv = (i) => S.metric === 'row' ? 100 : S.metric === 'n' ? raceTot[i] : pct(raceTot[i], total);
  const cell = (v) => S.metric === 'n' ? fmt(v) : pctTxt(v);
  let rows = RACES.map((_, i) => i).filter(raceOn).sort((a, b) => raceTot[b] - raceTot[a]);
  if (S.sort === 'race') rows.sort((a, b) => RACES[a].localeCompare(RACES[b]) * (S.sortDir === 'asc' ? 1 : -1));
  else if (S.sort === 'all') rows.sort((a, b) => (allv(b) - allv(a)) * (S.sortDir === 'asc' ? -1 : 1));
  else if (S.sort != null) { const j = S.sort; rows.sort((a, b) => (EXISTS[j][b] - EXISTS[j][a]) || (val(j, b) - val(j, a)) * (S.sortDir === 'asc' ? -1 : 1)); }
  let cols = CLASSES.map((_, j) => j);
  if (S.colRace >= 0) { const i = S.colRace; cols.sort((a, b) => (EXISTS[b][i] - EXISTS[a][i]) || val(b, i) - val(a, i)); }
  const best = {}, ext = {};
  for (const j of cols) {
    const v = rows.filter((i) => EXISTS[j][i] && g[j][i]).map((i) => val(j, i));
    if (v.length) { best[j] = Math.max(...v); ext[j] = [Math.min(...v), Math.max(...v)]; }
  }
  const sortAttr = (k) => S.sort === k ? ` aria-sort="${S.sortDir === 'asc' ? 'ascending' : 'descending'}"` : '';
  $('czTable').tHead.innerHTML = `<tr><th class="t"${sortAttr('race')}><button type="button" data-sort="race">Race</button></th>`
    + cols.map((j) => `<th${sortAttr(j)}><button type="button" data-sort="${j}" style="color:${soft(CLASS_COLOR[CLASSES[j]])}">${CLASSES[j]}</button></th>`).join('')
    + `<th${sortAttr('all')}><button type="button" data-sort="all">All</button></th></tr>`;
  $('czTable').tBodies[0].innerHTML = rows.map((i) => `<tr><td class="r${S.colRace === i ? ' picked' : ''}" data-race="${i}" tabindex="0" role="button">${raceImg(i)}${RACES[i]}</td>`
    + cols.map((j) => {
      if (!EXISTS[j][i]) return '<td></td>';
      const v = val(j, i), n = g[j][i], [lo, hi] = ext[j] || [0, 0], t = hi > lo ? (v - lo) / (hi - lo) : 1;
      tips[`t${j}_${i}`] = `<div class="h"><span style="color:${FAC_TEXT[FACTION(i)]}">${RACES[i]}</span> <span style="color:${CLASS_COLOR[CLASSES[j]]}">${CLASSES[j]}</span></div>`
        + tipRows([['Characters', fmt(n)], [`Of ${CLASSES[j]}s`, pctTxt(pct(n, classTot[j]))], [`Of ${RACE_PL[i]}`, pctTxt(pct(n, raceTot[i]))], ['Of everyone', pctTxt(pct(n, total))]]);
      return `<td class="${n && v === best[j] ? 'top best' : ''}" data-tip="t${j}_${i}" style="background:color-mix(in srgb, var(--accent) ${Math.round(6 + t * 34)}%, transparent)">${cell(v)}</td>`;
    }).join('')
    + `<td class="tot">${cell(allv(i))}</td></tr>`).join('');
  $('czTable').tHead.onclick = (e) => {
    const b = e.target.closest('[data-sort]'); if (!b) return;
    const k = b.dataset.sort === 'race' || b.dataset.sort === 'all' ? b.dataset.sort : +b.dataset.sort;
    if (S.sort !== k) { S.sort = k; S.sortDir = k === 'race' ? 'asc' : 'desc'; }
    else if (S.sortDir === (k === 'race' ? 'asc' : 'desc')) S.sortDir = k === 'race' ? 'desc' : 'asc';
    else S.sort = null;   // a third click: back to the usual order (most played race first)
    draw();
  };
  const pick = (td) => { const i = +td.dataset.race; S.colRace = S.colRace === i ? -1 : i; draw(); };
  $('czTable').tBodies[0].onclick = (e) => { const td = e.target.closest('td.r'); if (td) pick(td); };
  $('czTable').tBodies[0].onkeydown = (e) => { const td = e.target.closest('td.r'); if (td && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(td); } };
  fit();
}

// The table's size: its text and cells as big as the box's width allows without a sideways scrollbar, 1.2 times at
// most (the Sims page's matrix_fit.js).
const tbl = $('czTable'), wrap = tbl.parentElement, card = tbl.closest('section');
function fit() {
  if (!wrap.clientWidth) return;
  const scale = parseFloat(card.style.getPropertyValue('--mz')) || 1, prev = tbl.style.width;
  tbl.style.width = 'max-content';
  const w = tbl.offsetWidth / scale;
  tbl.style.width = prev;
  if (!w) return;
  const v = Math.max(1, Math.min(1.2, Math.floor(((wrap.clientWidth - 2) / w) * 100) / 100));
  if (Math.abs(v - scale) > 0.005) { card.style.setProperty('--mz', String(v)); $('czBal').style.setProperty('--mz', String(v)); }   // the faction names match the table's class names
}
new ResizeObserver(fit).observe(wrap);
