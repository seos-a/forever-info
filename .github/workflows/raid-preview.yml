# The Cloudflare Worker that gives shared raid links a picture of their roster (worker/, see worker/README.md).
# Every push that changes worker/ draws sample previews (downloadable from the run's Artifacts), runs the Worker locally
# against the live site, and on main deploys it once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist.
name: Raid link previews

on:
  push:
    paths: ["worker/**", ".github/workflows/raid-preview.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Publish samples (test branches only)
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Font (DejaVu Sans Bold, free to redistribute)
        run: |
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || sudo apt-get install -y fonts-dejavu-core
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf src/
      - run: npm install --no-audit --no-fund
      - name: Draw sample previews
        run: npm test
      - name: Bundle check
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Run the Worker locally against the live site
        continue-on-error: true   # reported in the run's annotations; a hiccup here shouldn't fail the run (or email)
        run: |
          # results as public annotations (a run's logs need a GitHub sign-in): newlines become %0A
          note(){ printf '::notice title=%s::%s\n' "$1" "$(printf '%s' "$2" | tail -c 3000 | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g' | awk 'BEGIN{ORS="%0A"}{gsub(/%/,"%25");print}')"; }
          npx wrangler dev --port 8787 --ip 127.0.0.1 > dev.log 2>&1 &
          up=0; for i in $(seq 90); do curl -s -o /dev/null http://127.0.0.1:8787/raid && { up=1; break; }; sleep 2; done
          [ $up = 1 ] || { note "wrangler dev did not start" "$(cat dev.log)"; exit 1; }
          set +e
          ok=1
          curl -s --compressed "http://127.0.0.1:8787/raid?1pg4jae09k~Happy_Gilmore" > out/page.html
          tags=$(grep -o '<meta property="og:[a-z:]*" content="[^"]*"' out/page.html); note "Preview tags" "$tags"
          echo "$tags" | grep -q 'raid-preview.png?1pg4jae09k' || ok=0
          curl -s -D out/headers.txt -o out/worker-ten.png "http://127.0.0.1:8787/raid-preview.png?1pg4jae09k~Happy_Gilmore&v=1"
          note "Preview picture" "$(cat out/headers.txt; file out/worker-ten.png)"
          file out/worker-ten.png | grep -q 'PNG image data, 1200 x 630' || ok=0
          curl -s --compressed "http://127.0.0.1:8787/raid" | grep -q 'images/og.png' || { ok=0; note "Plain /raid" "missing the usual og.png"; }
          [ $ok = 1 ] || { note "wrangler dev log" "$(tail -c 3000 dev.log)"; exit 1; }
      - if: always()
        run: cat dev.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raid-previews
          path: worker/out/
      # test branches: the sample pictures on a branch of their own, to look at without signing in
      - if: always() && github.ref != 'refs/heads/main'
        name: Publish samples
        working-directory: worker/out
        run: |
          git init -q -b raid-preview-samples && git add *.png
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "samples from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" raid-preview-samples

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy (skipped until the Cloudflare secrets are set)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "No Cloudflare secrets yet: not deploying."; exit 0; fi
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || sudo apt-get install -y fonts-dejavu-core
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf src/
          npm install --no-audit --no-fund
          npx wrangler deploy
