# Checks Wowhead's WoW Forever data twice a day (10 PM and 10:30 AM US Eastern) and, when talents or spells changed,
# opens a pull request with the updated site for review (a later run updates that same pull request). Nothing goes
# live until it is merged.
# Run it by hand from the Actions tab ("Beta sync" > "Run workflow").
name: Beta sync

on:
  schedule:
    # 10:00 PM and 10:30 AM US Eastern all year: the same evening as a patch (beta builds have reached Wowhead around
    # 3-4 PM Pacific, on Thursdays so far) and the next morning. Schedules are in UTC, so each time is listed for
    # daylight time (UTC-4) and standard time (UTC-5); the "when" job skips the one that doesn't apply.
    - cron: '0 2 * * *'          # 10:00 PM EDT
    - cron: '30 14 * * *'        # 10:30 AM EDT
    - cron: '0 3 * * *'          # 10:00 PM EST
    - cron: '30 15 * * *'        # 10:30 AM EST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          # a run by hand always goes; a scheduled one only if its UTC offset is New York's today
          offset=$(TZ=America/New_York date +%z)
          case "$CRON" in
            '') go=true ;;
            '0 2 * * *'|'30 14 * * *') [ "$offset" = "-0400" ] && go=true || go=false ;;
            *) [ "$offset" = "-0500" ] && go=true || go=false ;;
          esac
          echo "New York is UTC$offset, schedule '$CRON': go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  sync:
    needs: when
    if: needs.when.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pull the beta data and rebuild
        working-directory: tc
        run: |
          set -o pipefail
          {
            echo "Changes found in Wowhead's WoW Forever data on $(date -u +%Y-%m-%d). Review, then merge to publish."
            echo
            echo '### Talents'
            echo '```'
            python sync_talents.py
            echo '```'
            echo '### Spells'
            echo '```'
            python sync_spells.py
            echo '```'
            echo '### Talent cost / range / cast time / cooldown'
            echo '```'
            python talent_meta.py | tail -n 1
            echo '```'
            echo '### Class Changes page (review the buff / nerf guesses in tc/changes.json)'
            echo '```'
            python changelog.py
            echo '```'
            echo '### Build'
            echo '```'
            python build.py
            echo '```'
          } | tee ../sync-report.md
          cp ../web/*.html ..   # index.html and the section pages (rogue.html, spellbook.html...)
          { echo '### Icons'; echo '```'; python fetch_images.py; echo '```'; } | tee -a ../sync-report.md
          # changelog.py's "Needs a look" list (changes that look like data errors) goes at the very top
          if [ -s ../needs-a-look.md ]; then cat ../needs-a-look.md ../sync-report.md > ../report.tmp && mv ../report.tmp ../sync-report.md; fi

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: beta-sync
          delete-branch: true
          title: 'Beta sync: WoW Forever data changed'
          body-path: sync-report.md
          commit-message: |
            Beta sync: WoW Forever talent and spell data

            Automated by .github/workflows/beta-sync.yml
          add-paths: |
            *.html
            tc/*.json
            images/**
