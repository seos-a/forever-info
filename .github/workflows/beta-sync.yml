# Checks Wowhead's WoW Forever data twice a day and, when talents or spells changed, opens a pull request with the
# updated site for review (a later run updates that same pull request). Nothing goes live until it is merged.
# Run it by hand from the Actions tab ("Beta sync" > "Run workflow").
name: Beta sync

on:
  schedule:
    # beta builds have reached Wowhead around 22:00-23:00 UTC (3-4 PM US Pacific), on Thursdays so far
    - cron: '0 2 * * *'          # 02:00 UTC: 7 PM Pacific, 10 PM Eastern, the same evening as a patch
    - cron: '30 14 * * *'        # 14:30 UTC: the next morning in the US, for anything that landed late
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Pull the beta data and rebuild
        working-directory: tc
        run: |
          set -o pipefail
          {
            echo "Changes found in Wowhead's WoW Forever data on $(date -u +%Y-%m-%d). Review, then merge to publish."
            echo
            echo '### Talents'
            echo '```'
            python sync_talents.py
            echo '```'
            echo '### Spells'
            echo '```'
            python sync_spells.py
            echo '```'
            echo '### Talent cost / range / cast time / cooldown'
            echo '```'
            python talent_meta.py | tail -n 1
            echo '```'
            echo '### Class Changes page (review the buff / nerf guesses in tc/changes.json)'
            echo '```'
            python changelog.py
            echo '```'
            echo '### Build'
            echo '```'
            python build.py
            echo '```'
          } | tee ../sync-report.md
          cp ../web/index.html ../index.html
          { echo '### Icons'; echo '```'; python fetch_images.py; echo '```'; } | tee -a ../sync-report.md

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: beta-sync
          delete-branch: true
          title: 'Beta sync: WoW Forever data changed'
          body-path: sync-report.md
          commit-message: |
            Beta sync: WoW Forever talent and spell data

            Automated by .github/workflows/beta-sync.yml
          add-paths: |
            index.html
            tc/*.json
            images/**
