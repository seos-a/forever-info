<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 File Not Found – Forever Info</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a0d04">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* The 404 page, after the Burning Crusade-era WoW site's: a parchment panel with a red title bar. build.py writes it
   to ../404.html with the main page's textures filled in. Paths are absolute: GitHub serves it at any depth. */
:root{
/*VARS*/
  --bar-c:#841e18 0%,#60140f 40%,#380a08 80%,#230605 100%;
  color-scheme:dark}
html,body{margin:0;min-height:100%;background:#000;font-family:Verdana,Tahoma,"DejaVu Sans",Geneva,sans-serif}
main{min-height:100vh;box-sizing:border-box;display:grid;align-content:center;justify-items:center;gap:26px;padding:40px 16px}
.logo{width:min(520px,90vw);height:auto;image-rendering:pixelated}
.panel{width:min(640px,100%);padding:3px;background:#0d0d0f;border:1px solid #000;border-radius:3px;box-shadow:inset 0 0 0 1px #b8913f66,0 8px 22px #000d,0 0 0 1px #3a2a10}
.bar{display:flex;align-items:center;justify-content:center;min-height:30px;padding:4px 14px;color:#ffd75a;
  font-family:"Courier New",sans-serif,verdana,arial;font-size:12pt;font-weight:bold;font-variant:small-caps;letter-spacing:2px;   /* the old page's title bar text (span.date) */
  text-shadow:0 1px 0 #000,0 -1px 0 #2a0200,0 0 6px #000;
  background:var(--tex-weather) 0 0/300px 60px,radial-gradient(ellipse 110% 160% at 50% 45%,var(--bar-c));
  border:1px solid #000;border-radius:2px;box-shadow:inset 0 0 0 1px #000,inset 0 0 12px #000d,inset 0 1px 0 #ff7a5a22,0 0 0 1px #c9a24c,0 0 0 2px #7a5618,0 0 0 3px #000,0 2px 5px #000}
.parch{margin-top:7px;color:#2b1a0a;padding:20px 24px 24px;border-radius:2px;border:1px solid #5c3d16;background:var(--parch-bg);
  box-shadow:inset 0 0 0 1px #f9eccb66,inset 0 0 28px #6b3e12aa,inset 0 0 70px #7a461477,inset 0 0 3px #5c3d16,0 0 0 1px #000}
h1{margin:0 0 8px;font-family:palatino,georgia,"times new roman",serif;font-size:13pt;font-weight:bold;color:#640909}   /* the old page's .title heading */
.row{display:flex;align-items:center;gap:22px}
.oops{flex:none;display:grid;justify-items:center;padding:0 8px}   /* "Oops!" centred above the peon */
.oops img{width:42px;height:60px}   /* the old site's peon, at its own 42x60 */
/* the message and links exactly as on the old site's page: 12px Arial, 140% line height, black text; links bold,
   underlined, #1E4378, red #C60000 on hover */
p,ul{font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:140%;color:#000}
p{margin:0 0 10px}
ul{margin:0;padding-left:20px;list-style-type:disc}
a{color:#1E4378;font-weight:bold;text-decoration:underline;background-color:transparent}
a:hover,a:focus-visible{color:#C60000}
@media (max-width:520px){.row{flex-direction:column;gap:12px}}
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Forever Info home"><img class="logo" src="/images/logo.png" alt="Forever Info" width="1073" height="215"></a>
  <section class="panel">
    <div class="bar">404 File Not Found!</div>
    <div class="parch">
      <div class="row">
        <div class="oops"><h1>Oops!</h1><img src="/images/peon-headscratch.gif" alt="" width="42" height="60"></div>   <!-- the peon is from the 2008 worldofwarcraft.com 404 page -->
        <div>
          <p>The page you were looking for doesn't exist! Sorry!</p>
          <ul>
            <li><a href="/" id="back">Go back to the previous page</a></li>
            <li><a href="/">Return to main</a></li>
          </ul>
        </div>
      </div>
    </div>
  </section>
</main>
<script>
/* "previous page": back where they came from, or the home page if they arrived straight here */
document.getElementById("back").addEventListener("click",function(e){ if(history.length>1&&document.referrer){ e.preventDefault(); history.back(); } });
</script>
</body>
</html>
