<!-- The Population Census page (foreverinfo.io/census): who plays which race and class, from Raider.IO's census.
     census.py wraps this in the Sims page's frame (experiment.CSS: colours, fonts, background, the Home button and the
     corner stamp) and fills window.__CENSUS from census.json. Laid out like the Sims page's DPS tab: a ranking box of the
     classes (clicking a class shows its races in the same box), a ranking box of the races (clicking a race shows its
     classes), each with a breadcrumb back and the browser's Back closing it, then the race x class table, drawn and
     sorted like the Sims page's "DPS by Race and Spec". The boxes copy experiment/page.html's look (.rr-card, .rr-seg,
     .rr-tip, its ranking chart and its .lx-matrix table). -->
<style>
  .cz { --al: #3f7fd9; --ho: #d2423b; --gold: #e2b23c; --accent: #5b9bd5; display: flex; flex-direction: column; gap: var(--cds-gap-lg); color: var(--color-fg); }
  .cz p { margin: 0; }
  .cz a { color: #ffd100; text-underline-offset: 2px; }
  .cz-note { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); line-height: 1.45; }

  /* along the top, on the background picture: the faction crests (pick one to show only its races, again for all), as
     the Sims page, then the region flags and the ruleset icons, each group in a small panel */
  .cz-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--cds-gap-sm) var(--cds-gap-md); padding: var(--cds-pad-xs) 2px; margin-bottom: calc(var(--cds-gap-md) - var(--cds-gap-lg)); }
  .cz-fac { display: flex; gap: var(--cds-gap-sm); }
  .cz-fac button { width: 32px; height: 32px; padding: 0; margin: 0; cursor: pointer; border: 2px solid #000; border-radius: 4px; overflow: hidden; background: #111;
    box-shadow: 0 0 0 1px #8a6a2a, 0 3px 8px #000c; transition: box-shadow .15s, filter .15s; }
  .cz-fac button img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cz-fac button:hover { filter: brightness(1.15); }
  .cz-fac button[aria-pressed="true"] { box-shadow: 0 0 0 2px #ffd75a, 0 0 10px #ffd75a99, 0 3px 8px #000c; }
  .cz-fac button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 3px; }
  .cz-fac button:disabled { filter: grayscale(1) brightness(.45); cursor: default; }   /* a ruleset the region has no realms of (Korea, Taiwan: no RP) */
  /* each group (regions, factions, rulesets) in a small panel, styled as the page's cards */
  .cz-top > .cz-fac { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 6px; }
  @media (max-width: 600px) { .cz-fac button { width: 28px; height: 28px; } }
  /* the region buttons (first in the row) are the crests' buttons around each region's square flag (images/flags, drawn by art/flags.py) */

  .cz-seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
  .cz-seg button { font: inherit; font-size: var(--cds-font-size-caption); padding: var(--cds-pad-xs) var(--cds-pad-sm); background: var(--color-bg); color: var(--color-fg);
    border: 0; border-right: 1px solid var(--color-border-line); cursor: pointer; }
  .cz-seg button:last-child { border-right: 0; }
  .cz-seg button[aria-pressed="true"] { background: var(--color-fg); color: var(--color-bg); }
  .cz-seg button:disabled { color: var(--color-fg-muted); opacity: .45; cursor: default; }
  .cz button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: -3px; }

  .cz-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg);
    display: flex; flex-direction: column; gap: var(--cds-gap-sm); min-width: 0; }
  .cz-cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--cds-gap-sm); }
  /* a box's count line, with the levels switch (All / 60) at its right; every box's switch is the same one */
  .cz-small { color: #e2b23c; }   /* "small sample" after a thin pick's count */
  @media (max-width: 600px) { .cz-card { padding: 10px; } }

  /* an open breakdown's breadcrumb: "Classes › Paladin", the first part going back to the whole list */
  .cz-crumbs { display: flex; align-items: center; font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); line-height: 24px; }   /* every part on one centre line, the All / 60 Only switch's */
  .cz-crumb { font: inherit; border: 0; background: none; padding: 0; color: var(--color-fg-muted); cursor: pointer; }
  .cz-root { color: var(--color-fg); }
  .cz-count { color: var(--color-fg-muted); font-weight: 400; margin-left: .35em; white-space: pre; }   /* "(NA-PvP-Alliance) 473,962" after the title */
  .cz-crumb:hover { color: var(--color-fg); text-decoration: underline; text-underline-offset: 3px; }
  .cz-crumbsep { color: var(--color-fg-muted); margin: 0 .35em; font-weight: 400; font-size: 1.4em; line-height: 1; position: relative; top: -.06em; }
  .cz-crumbs img { width: 1em; height: 1em; border-radius: 3px; margin-right: .4em; flex: none; }   /* as tall as the text */
  /* the picked class or race: a button opening a menu of the others (the Sims page's .rr-pick and .rr-menu) */
  .cz-pickwrap { position: relative; display: flex; }
  .cz-pick { font: inherit; display: inline-flex; align-items: center; padding: 0 .3em; margin: 0 -.3em; border: 0; border-radius: var(--cds-radius); background: none; cursor: pointer; }
  .cz-pick:hover, .cz-pick[aria-expanded="true"] { background: color-mix(in srgb, var(--color-fg) 10%, transparent); }
  .cz-menu { position: absolute; left: -.3em; top: calc(100% + 4px); z-index: 20; display: grid; min-width: 12rem; max-height: 24rem; overflow: auto; overscroll-behavior: contain; padding: 4px;
    background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); font-size: var(--cds-font-size-body); font-weight: 400; line-height: 1.45; }
  .cz-menu button { font: inherit; display: flex; align-items: center; gap: .5rem; text-align: left; padding: var(--cds-pad-xs) var(--cds-pad-sm); border: 0; border-radius: var(--cds-radius); background: none; cursor: pointer; white-space: nowrap; }
  .cz-menu button img { width: 18px; height: 18px; border-radius: 3px; margin: 0; vertical-align: 0; }
  .cz-menu button:hover, .cz-menu button:focus-visible { background: color-mix(in srgb, var(--color-fg) 10%, transparent); outline: none; }
  .cz-menu button[aria-checked="true"] { background: color-mix(in srgb, var(--color-fg) 6%, transparent); }

  /* the ranking charts: the name column (icon and name), then the bar column with its gridlines and axis; each bar is
     followed by its share in bold, the character count, and (the classes) the most played race. The longest bar leaves
     --lab of room for that label. */
  .cz-rank { --name: 11rem; --lab: 8rem; position: relative; display: flex; flex-direction: column; gap: 4px; font-size: var(--cds-font-size-caption); }
  .cz-rank.cz-hastop { --lab: 17rem; }   /* the classes' bars also carry the most played race */
  .cz-grid { position: absolute; top: 0; bottom: 0; left: var(--name); right: 0; pointer-events: none; }
  .cz-grid i { position: absolute; top: 0; bottom: 20px; width: 1px; background: var(--cds-chart-grid); }
  .cz-grid span { position: absolute; bottom: 0; transform: translateX(-50%); color: var(--color-fg-muted); font-variant-numeric: tabular-nums; line-height: 14px; }
  .cz-row { font: inherit; position: relative; display: grid; grid-template-columns: var(--name) minmax(0, 1fr); align-items: center; height: 22px; padding: 0; border: 0;
    background: none; color: var(--color-fg); text-align: left; white-space: nowrap; }
  button.cz-row { cursor: pointer; }
  button.cz-row:hover .bar > i { filter: brightness(1.12); }
  button.cz-row:hover .nm b { text-decoration: underline; text-underline-offset: 2px; }
  .cz-row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; padding-right: 10px; }
  .cz-row .nm img { width: 20px; height: 20px; border-radius: 3px; flex: none; }
  .cz-row .nm b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .cz-row .bar { display: flex; align-items: center; gap: 7px; height: 100%; min-width: 0; }
  .cz-row .bar > i { flex: none; height: 100%; border-radius: 3px; min-width: 2px; }
  .cz-row .p { font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
  .cz-row .c { color: var(--color-fg-muted); font-variant-numeric: tabular-nums; }
  .cz-row .top { display: inline-flex; align-items: center; gap: 6px; color: var(--color-fg-muted); }
  .cz-row .top img { width: 20px; height: 20px; border-radius: 4px; }
  .cz-row.dim { opacity: .45; }
  /* rising / falling since last week: a green or red triangle and the change in points, after the share */
  .cz-rank.cz-hasmv { --mvw: 3.2rem; }   /* room for it, only when some bar has one */
  .cz-row .mv { font-weight: 600; font-size: .92em; font-variant-numeric: tabular-nums; margin-left: -3px; white-space: nowrap; }
  .cz-row .mv.up { color: #4ec46a; }
  .cz-row .mv.down { color: #f0605a; }
  .cz-axis { height: 16px; }
  .cz-empty { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); padding: 6px 0; }
  @media (max-width: 760px) { .cz-rank, .cz-rank.cz-hastop { --name: 8.5rem; --lab: 8.5rem; } .cz-row .c, .cz-row .top span { display: none; } }
  @media (max-width: 420px) { .cz-rank, .cz-rank.cz-hastop { --name: 7rem; --lab: 3.5rem; } .cz-row .top { display: none; } }

  /* the faction balance: one bar, Alliance from the left and Horde from the right, a tick at the middle, the crests at its
     ends and each side's share and count under it */
  .cz-bal { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
  .cz-bal > img { width: 26px; height: 26px; border: 2px solid #000; border-radius: 4px; box-shadow: 0 0 0 1px #8a6a2a; }
  /* the bar sits on the ranking charts' gridlines (every 25%, standing out above and below it), the 50% one also
     drawn faintly across it; the black line marks where Alliance meets Horde */
  .cz-balwrap { position: relative; padding: 8px 0; }
  .cz-balgrid i { position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: var(--cds-chart-grid); }
  .cz-balgrid i.mid { background: color-mix(in srgb, var(--color-fg) 30%, transparent); }
  .cz-balmid { position: absolute; top: 8px; bottom: 8px; left: 50%; width: 1px; margin-left: -.5px; background: #fff5; z-index: 2; pointer-events: none; }
  .cz-balbar { position: relative; z-index: 1; display: flex; height: 18px; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px #0006; }
  .cz-balbar i { height: 100%; transition: width .25s; }
  .cz-balbar i.seg { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; box-shadow: inset -1px 0 #0009; }   /* one class's share of the picked faction */
  .cz-balbar i.seg { font-style: normal; font-size: calc(var(--cds-font-size-caption) * var(--mz, 1)); font-weight: 600; color: #111; font-variant-numeric: tabular-nums; white-space: nowrap; }   /* its share */
  .cz-balbar b { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #000c; transition: left .25s; }
  .cz-ballab { grid-column: 2; display: flex; justify-content: space-between; font-size: calc(var(--cds-font-size-caption) * var(--mz, 1)); margin-top: -8px; font-variant-numeric: tabular-nums; }
  .cz-ballab b { font-weight: var(--cds-font-weight-medium); }   /* as the table's class names, which they match in size */
  .cz-ballab span { display: flex; gap: .45em; align-items: baseline; color: #fff; }   /* the faction's name in its colour, its share and count in white */
  .cz-ballab em { font-style: normal; }
  /* on a phone the two counts would run together in the middle: each side's count goes under its name and share, muted */
  @media (max-width: 600px) {
    .cz-ballab span { display: grid; grid-auto-flow: column; justify-content: start; column-gap: .45em; }
    .cz-ballab span em { grid-row: 2; grid-column: 1 / span 2; color: var(--color-fg-muted); }
    .cz-ballab span:last-child { justify-content: end; text-align: right; }
  }

  /* race portraits: a faction-coloured rim; the Alliance Skyborne mirrored to face right, as on the Racials page */
  .cz img.race { box-shadow: 0 0 0 1.5px var(--al); }
  .cz img.race.Horde { box-shadow: 0 0 0 1.5px var(--ho); }
  .cz img.mirror { transform: scaleX(-1); }

  /* the race x class table: the Sims page's .lx-matrix. Its text and cells grow to fill the box (--mz, up to 1.2 times,
     as matrix_fit.js) */
  .cz-scroll { overflow: auto; max-width: 100%; }
  .cz table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: calc(var(--cds-font-size-caption) * var(--mz, 1)); font-variant-numeric: tabular-nums; }
  .cz th { position: sticky; top: 0; background: var(--color-panel); text-align: center; font-weight: var(--cds-font-weight-medium); padding: 0; border-bottom: 1px solid var(--color-border-line); white-space: nowrap; z-index: 1; }
  .cz th.t { text-align: left; left: 0; z-index: 3; }   /* the Race heading stays put over the race column */
  .cz th button { font: inherit; color: var(--color-fg-muted); background: none; border: 0; padding: calc(var(--cds-pad-xs) * var(--mz, 1)) calc(var(--cds-pad-sm) * var(--mz, 1)); cursor: pointer; width: 100%; text-align: inherit; white-space: nowrap; }
  .cz th button:hover, .cz th[aria-sort] button { filter: brightness(1.25); }
  .cz th.t button:hover, .cz th.t[aria-sort] button { color: var(--color-fg); filter: none; }
  .cz th[aria-sort="ascending"] button::after { content: " ▲"; font-size: .7em; }
  .cz th[aria-sort="descending"] button::after { content: " ▼"; font-size: .7em; }
  .cz td { text-align: center; padding: calc(var(--cds-pad-xs) * var(--mz, 1)) calc(var(--cds-pad-sm) * var(--mz, 1)); border-bottom: 1px solid var(--color-border-line); white-space: nowrap; }
  .cz tbody tr:hover td { box-shadow: inset 0 0 0 9999px color-mix(in srgb, var(--color-fg) 5%, transparent); }
  .cz td.top { font-weight: 600; }
  .cz td.best { box-shadow: inset 3px 0 0 var(--gold); }
  .cz tbody tr:hover td.best { box-shadow: inset 3px 0 0 var(--gold), inset 0 0 0 9999px color-mix(in srgb, var(--color-fg) 5%, transparent); }
  .cz td.tot { color: var(--color-fg-muted); }
  .cz td.r { text-align: left; position: sticky; left: 0; z-index: 2; background: var(--color-panel); cursor: pointer; width: 1%; }
  .cz td.r:hover { text-decoration: underline; }
  .cz td.r.picked { font-weight: 700; box-shadow: inset 2px 0 0 var(--color-fg); }
  .cz td.r.picked::after { content: ' ▸'; color: var(--color-fg-muted); }
  .cz td.r img { width: 1.5em; height: 1.5em; vertical-align: middle; margin: -.2em .5em -.2em 1px; border-radius: 4px; }

  /* tooltips: the Sims page's near-black card */
  .cz-tip { position: fixed; z-index: 50; pointer-events: none; background: #0c0c0bf5; border: 1px solid #ffffff26; border-radius: 6px; box-shadow: 0 10px 28px #000d, 0 0 0 1px #000;
    padding: 8px 11px 9px; font-size: 12px; line-height: 1.5; color: var(--color-fg); min-width: 170px; }
  .cz-tip[hidden] { display: none; }
  .cz-tip .h { font-weight: 700; font-size: 13px; line-height: 1.35; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid #ffffff1f; }
  .cz-tip .h:only-child { margin: 0; padding: 0; border: 0; font-size: 12px; }   /* a name alone (the filter icons): */
  .cz-tip:has(> .h:only-child) { min-width: 0; padding: 4px 8px; white-space: nowrap; }   /* a small box around just the name */
  .cz-tip .row { display: flex; gap: .5rem; padding: 1px 0; }
  .cz-tip .row > span { color: #a7a49b; }
  .cz-tip .row b { margin-left: auto; padding-left: 1rem; font-weight: 600; color: #f4f2ea; }

  /* the Methods and Caveats box: the Sims page's notes card, its arrow folding it down to its title */
  .cz h2 { font-size: calc(var(--cds-font-size-heading) + 2px); font-weight: var(--cds-font-weight-medium); margin: 0; line-height: 1.9rem; }
  .cz-title { display: flex; align-items: center; gap: var(--cds-gap-xs); }
  .cz-fold { flex: none; width: 1.5rem; height: 1.5rem; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: var(--cds-radius); background: none; color: var(--color-fg-muted); cursor: pointer; }
  .cz-fold:hover { color: var(--color-fg); background: color-mix(in srgb, var(--color-fg) 8%, transparent); }
  .cz-fold::before { content: ""; width: .45rem; height: .45rem; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .15s; }
  .cz-card.collapsed .cz-fold::before { transform: rotate(-45deg); }
  .cz-card.collapsed > :not(.cz-cardhead) { display: none; }
  .cz-notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--cds-gap-md) var(--cds-gap-lg); font-size: var(--cds-font-size-caption); line-height: 1.5; color: var(--color-fg-muted); }
  .cz-notes b { display: block; color: var(--color-fg); font-weight: 600; }
</style>

<div class="cz">
  <div class="cz-top">
    <div class="cz-fac" id="czRegion" role="group" aria-label="Region">
      <button type="button" data-v="us" aria-pressed="false" aria-label="NA" data-tip="f-us"><img src="images/flags/us.svg?v=2" alt=""></button>
      <button type="button" data-v="eu" aria-pressed="false" aria-label="EU" data-tip="f-eu"><img src="images/flags/eu.svg?v=2" alt=""></button>
      <button type="button" data-v="kr" aria-pressed="false" aria-label="Korea" data-tip="f-kr"><img src="images/flags/kr.svg?v=2" alt=""></button>
      <button type="button" data-v="tw" aria-pressed="false" aria-label="Taiwan" data-tip="f-tw"><img src="images/flags/tw.svg?v=3" alt=""></button>
    </div>
    <div class="cz-fac" id="czRules" role="group" aria-label="Ruleset">
      <button type="button" data-v="Normal" aria-pressed="false" aria-label="Normal Ruleset" data-tip="f-Normal"><img src="images/icons/inv_camelot_camping_campfirenearby.jpg" alt=""></button>
      <button type="button" data-v="PvP" aria-pressed="false" aria-label="PvP Ruleset" data-tip="f-PvP"><img src="images/icons/achievement_bg_winwsg.jpg" alt=""></button>
      <button type="button" data-v="Roleplay" aria-pressed="false" aria-label="Roleplay Ruleset" data-tip="f-Roleplay"><img src="images/icons/ability_rogue_disguise.jpg" alt=""></button>
      <button type="button" data-v="Roleplay PvP" aria-pressed="false" aria-label="Roleplay PvP Ruleset" data-tip="f-Roleplay PvP"><img src="images/icons/achievement_pvp_legion03.jpg" alt=""></button>
    </div>
    <div class="cz-fac" id="czFaction" role="group" aria-label="Faction">
      <button type="button" data-v="Alliance" aria-pressed="false" aria-label="Alliance" data-tip="f-Alliance"><img src="images/icons/faction_alliance.jpg" alt=""></button>
      <button type="button" data-v="Horde" aria-pressed="false" aria-label="Horde" data-tip="f-Horde"><img src="images/icons/faction_horde.jpg" alt=""></button>
    </div>
  </div>

  <section class="cz-card" aria-label="Classes">
    <div class="cz-cardhead"><div id="czClassHead"></div><div class="cz-seg cz-lvl" data-box="cls" role="group" aria-label="Levels"></div></div>
    <div class="cz-rank" id="czClass"></div>
  </section>

  <section class="cz-card" aria-label="Races">
    <div class="cz-cardhead"><div id="czRaceHead"></div><div class="cz-seg cz-lvl" data-box="race" role="group" aria-label="Levels"></div></div>
    <div class="cz-rank" id="czRace"></div>
  </section>

  <section class="cz-card" aria-label="Faction balance">
    <div class="cz-bal" id="czBal"></div>
  </section>

  <section class="cz-card" aria-label="Race and class">
    <div class="cz-cardhead"><div class="cz-seg" id="czMetric" role="group" aria-label="Show"></div><div class="cz-seg cz-lvl" data-box="table" role="group" aria-label="Levels"></div></div>
    <div class="cz-scroll"><table id="czTable"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="cz-card collapsed" id="czNotesCard">
    <div class="cz-cardhead"><div class="cz-title"><button type="button" class="cz-fold" aria-expanded="false" aria-label="Expand Methods and Caveats"></button><h2>Methods and Caveats</h2></div></div>
    <div class="cz-notes">
      <p><b>Where the numbers come from</b>The <a href="https://forever.raider.io/population" target="_blank" rel="noopener">Raider.IO</a> census of every WoW Forever character it tracks. It counts characters, not players: one player can have several, and characters nobody plays any more still count.</p>
      <p><b>Levels</b><span id="czLevels"></span></p>
    </div>
  </section>
</div>
<div class="cz-tip" id="czTip" hidden></div>

<script>
(() => {
const C = window.__CENSUS;
const RACES = C.races, CLASSES = C.classes;
const FACTION = (i) => i < 5 ? 'Alliance' : 'Horde';
const RACE_ICON = ['race_human_male', 'race_dwarf_male', 'race_nightelf_female', 'race_gnome_female', 'race_bloodelf_male_tbc',
  'race_orc_male', 'race_scourge_male', 'race_tauren_male', 'race_troll_male', 'race_bloodelf_female_skyborne'];
// the race's plural, for "Of Night Elves"
const RACE_PL = ['Humans', 'Dwarves', 'Night Elves', 'Gnomes', 'High Order Skyborne', 'Orcs', 'Undead', 'Tauren', 'Trolls', 'Windshaper Skyborne'];
// WoW class colours (as the Sims page); bars and headers soften them toward the text colour, as its specColor
const CLASS_COLOR = { Druid: '#FF7C0A', Hunter: '#AAD372', Mage: '#3FC7EB', Paladin: '#F48CBA', Priest: '#FFFFFF', Rogue: '#FFF468', Shaman: '#0070DD', Warlock: '#8788EE', Warrior: '#C69B6D' };
const soft = (c) => `color-mix(in srgb, ${c} 85%, var(--color-fg))`;
const FAC_COLOR = { Alliance: 'var(--al)', Horde: 'var(--ho)' }, FAC_TEXT = { Alliance: '#74a9ff', Horde: '#ff6d5f' };
const REGIONS = [['all', 'All regions'], ['us', 'Americas'], ['eu', 'Europe'], ['kr', 'Korea'], ['tw', 'Taiwan']];
const RULES = [['', 'All rulesets', 'all'], ['Normal', 'Normal', 'normal'], ['PvP', 'PvP', 'pvp'], ['Roleplay', 'RP', 'rp'], ['Roleplay PvP', 'RP-PvP', 'rppvp']];
const METRICS = [['col', '% of class'], ['row', '% of race'], ['all', '% of all'], ['n', 'Characters']];
const raceImg = (i) => `<img class="race ${FACTION(i)}${i === 4 ? ' mirror' : ''}" src="images/icons/${RACE_ICON[i]}.jpg" alt="">`;
const classImg = (j) => `<img src="images/icons/classicon_${CLASSES[j].toLowerCase()}.jpg" alt="">`;
const fmt = (n) => n.toLocaleString('en-US');
const pct = (a, b) => b ? a / b * 100 : 0;
const pctTxt = (v) => v === 0 ? '0%' : v.toFixed(1) + '%';
const $ = (id) => document.getElementById(id);

// The filters live in the address (/census?eu,pvp,horde), so a link or a reload keeps them. An open breakdown doesn't:
// as on the Sims page, a reload starts on the full lists.
const LV_TOKENS = [['cls', 'classes60'], ['race', 'races60'], ['table', 'table60']];
const S = { region: 'all', rules: '', faction: '', level: { cls: 'all', race: 'all', table: 'all' }, cls: -1, race: -1, metric: 'col', sort: null, sortDir: 'desc', colRace: -1 };
for (const t of location.search.slice(1).toLowerCase().split(/[,&+]/).filter(Boolean)) {
  // each box has its own All / 60 Only switch: "60" in the link puts all three at level 60, "classes60" one box
  if (t === '60') { for (const b in S.level) S.level[b] = '60'; continue; }
  const lb = LV_TOKENS.find(([, tok]) => tok === t); if (lb) { S.level[lb[0]] = '60'; continue; }
  if (REGIONS.some(([k]) => k === t && k !== 'all')) { S.region = t; continue; }
  const ru = RULES.find((r) => r[2] === t && r[0]); if (ru) { S.rules = ru[0]; continue; }
  if (t === 'alliance' || t === 'horde') S.faction = t[0].toUpperCase() + t.slice(1);
}
const link = () => {
  const parts = [];
  if (S.region !== 'all') parts.push(S.region);
  if (S.rules) parts.push(RULES.find((r) => r[0] === S.rules)[2]);
  if (S.faction) parts.push(S.faction.toLowerCase());
  if (Object.values(S.level).every((v) => v === '60')) parts.push('60');
  else for (const [b, tok] of LV_TOKENS) if (S.level[b] === '60') parts.push(tok);
  return location.pathname + (parts.length ? '?' + parts.join(',') : '');
};

// Opening a breakdown (a class's races, a race's classes) adds a history entry, so the browser's Back closes it, as on
// the Sims page; closing it from the page (its breadcrumb) uses that entry up again. open lists the boxes opened, last
// one last; a reload (which keeps an entry's marker) starts clean.
const open = [];
if (history.state && history.state.cz) history.replaceState(null, '', location.href);
const show = (box, idx) => {
  const was = S[box] >= 0; S[box] = idx;
  if (!was) { open.push(box); history.pushState({ cz: box }, '', location.href); }
  draw();
};
const hide = (box) => {
  if (S[box] < 0) return;
  if (open[open.length - 1] === box && history.state && history.state.cz === box) { history.back(); return; }   // popstate closes it
  S[box] = -1; open.splice(open.indexOf(box), 1); draw();
};
addEventListener('popstate', () => { const box = open.pop(); if (box) { S[box] = -1; draw(); } });

const has = (region, rules) => !!C.counts[rules ? region + '|' + rules : region];
const raceOn = (i) => !S.faction || FACTION(i) === S.faction;
// the counts in view, [class][race], with the other faction's races zeroed
const counts = (lv) => (lv === '60' ? C.counts60 : C.counts)[S.rules ? S.region + '|' + S.rules : S.region];   // all levels (10-60) or level 60 only
const grid = (lv) => counts(lv).map((row) => row.map((n, i) => raceOn(i) ? n : 0));
// which race / class combinations exist at all (any count anywhere)
const EXISTS = CLASSES.map((_, j) => RACES.map((_, i) => C.counts.all[j][i] > 0));
const argmax = (a) => a.reduce((b, v, i) => v > a[b] ? i : b, 0);

function segs(el, items, cur, onPick, disabled = () => false) {
  el.innerHTML = items.map(([v, label]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}"${disabled(v) ? ' disabled' : ''}>${label}</button>`).join('');
  el.onclick = (e) => { const b = e.target.closest('button'); if (b && !b.disabled) onPick(b.dataset.v); };
}

// tooltips: each row and cell keeps its tooltip's HTML in tips[key]
const tips = {}, tip = $('czTip');
const tipRows = (rows) => rows.map(([k, v]) => `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
// On a phone a tap fires one mousemove: a tapped bar or cell shows its tooltip until the next touch or scroll, and the
// filter icons show none (the icon's own look already says it's picked)
let touched = 0;
document.addEventListener('touchstart', () => { touched = Date.now(); tip.hidden = true; }, { passive: true });
addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  if (!el || !tips[el.dataset.tip] || (Date.now() - touched < 1500 && el.closest('.cz-top'))) { tip.hidden = true; return; }
  tip.innerHTML = tips[el.dataset.tip]; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';
  tip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
});
document.addEventListener('mouseleave', () => { tip.hidden = true; });
// the filter icons along the top: an instant tooltip with the icon's name (the factions in their colours), in place of the
// browser's slow title text
document.querySelectorAll('.cz-top button[data-tip]').forEach((b) => {
  const v = b.dataset.v, c = { Alliance: FAC_TEXT.Alliance, Horde: FAC_TEXT.Horde }[v];
  tips[b.dataset.tip] = `<div class="h"${c ? ` style="color:${c}"` : ''}>${b.getAttribute('aria-label').replace(/ Ruleset$/, '')}</div>`;   // the server type alone: "Roleplay PvP"
});

// a ranking chart: items {key, name, nameColor, color (bar), img, n, top (the label's most played race or class), onClick}
function rank(el, items, sum) {
  const shown = items.filter((d) => d.ok !== false).sort((a, b) => b.n - a.n);
  if (!shown.length || !sum) { el.innerHTML = '<p class="cz-empty">No characters for this pick.</p>'; el.onclick = null; return; }
  const maxPct = Math.max(...shown.map((d) => pct(d.n, sum)));
  // the axis: a round step giving about four to six gridlines
  const step = [1, 2, 5, 10, 20, 25, 50].find((s) => maxPct / s <= 6) || 50;
  const ticks = []; for (let t = 0; t <= maxPct + 1e-9; t += step) ticks.push(t);
  const x = (v) => `calc((100% - var(--lab) - var(--mvw, 0rem)) * ${(v / maxPct).toFixed(4)})`;
  el.classList.toggle('cz-hastop', shown.some((d) => d.top));
  el.classList.toggle('cz-hasmv', shown.some((d) => d.mv));   // more room for the bar's label when it names the top pick (a class, not an inline
  // style, so the phone widths' smaller room still applies)
  el.innerHTML = '<div class="cz-grid">' + ticks.map((t) => `<i style="left:${x(t)}"></i><span style="left:${x(t)}">${t}%</span>`).join('') + '</div>'
    + shown.map((d) => {
      const p = pct(d.n, sum), tag = d.onClick ? 'button' : 'div';
      return `<${tag}${d.onClick ? ' type="button"' : ''} class="cz-row${d.n ? '' : ' dim'}" data-k="${d.key}" data-tip="${d.key}"><span class="nm">${d.img}<b style="color:${d.nameColor || 'var(--color-fg)'}">${d.name}</b></span>`
        + `<span class="bar"><i style="width:${x(p)};background:${soft(d.color)}"></i><span class="p">${pctTxt(p)}</span>${d.mv || ''}<span class="c">${fmt(d.n)}</span>`
        + (d.top ? `<span class="top">${d.top.img}<span>${d.top.name}</span></span>` : '') + `</span></${tag}>`;
    }).join('') + '<div class="cz-axis"></div>';
  const click = Object.fromEntries(shown.filter((d) => d.onClick).map((d) => [d.key, d.onClick]));
  el.onclick = (e) => { const r = e.target.closest('button.cz-row'); if (r && click[r.dataset.k]) click[r.dataset.k](); };
}
// Rising / falling since last week (Raider.IO's weekly history, census.json's prev): the share now against the share
// in the week before this one, for the region, ruleset, levels and faction picked. Shown only for a move of 0.2 points
// or more, and never when either week has under 1,000 characters (a small sample's shares jump around).
const MV_MIN = 0.2, MV_N = 1000;
const lastWeek = (lv) => (C.prev[lv] || {})[S.rules ? S.region + '|' + S.rules : S.region];
const weekTxt = (w) => { const [y, m, d] = w.split('-').map(Number); return `Last week (${MONTHS[m - 1]} ${d})`; };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// {html, row}: the arrow after the bar's share, and a tooltip row with last week's share ('' and null when none)
function move(now, nowTot, was, wasTot, week) {
  if (!week || nowTot < MV_N || wasTot < MV_N) return { html: '', row: null };
  const a = pct(now, nowTot), b = pct(was, wasTot), dv = Math.round((a - b) * 10) / 10;
  const row = [weekTxt(week), pctTxt(b)];
  if (Math.abs(dv) < MV_MIN) return { html: '', row };
  return { html: `<span class="mv ${dv > 0 ? 'up' : 'down'}" aria-label="${dv > 0 ? 'up' : 'down'} ${Math.abs(dv).toFixed(1)} points since last week">${dv > 0 ? '▲' : '▼'}${Math.abs(dv).toFixed(1)}</span>`, row };
}
// An open breakdown's title: the list's name (back to it), then the picked class or race, which opens a menu of all of
// them in their colours to switch to another (as the Sims page's spec picker). items: [{idx, img, name, color}]
const crumbs = (head, box, root, items, cur, count) => {
  const it = items.find((d) => d.idx === cur);
  head.innerHTML = `<div class="cz-crumbs"><button type="button" class="cz-crumb">${root}</button><span class="cz-crumbsep" aria-hidden="true">›</span>`
    + `<span class="cz-pickwrap"><button type="button" class="cz-pick" aria-haspopup="menu" aria-expanded="false">${it.img}<span style="color:${it.color}">${it.name}</span></button></span>${count}</div>`;
  head.querySelector('.cz-crumb').onclick = () => hide(box);
  const pick = head.querySelector('.cz-pick'), wrap = pick.parentElement;
  pick.onclick = (e) => {
    e.stopPropagation();
    const was = wrap.querySelector('.cz-menu'); closeMenus(); if (was) return;
    const menu = document.createElement('div'); menu.className = 'cz-menu'; menu.setAttribute('role', 'menu');
    menu.innerHTML = items.slice().sort((a, b) => a.name.localeCompare(b.name)).map((d) => `<button type="button" role="menuitemradio" aria-checked="${d.idx === cur}" data-i="${d.idx}">${d.img}<span style="color:${d.color}">${d.name}</span></button>`).join('');
    menu.onclick = (ev) => { const b = ev.target.closest('button'); if (!b) return; closeMenus(); S[box] = +b.dataset.i; draw(); };
    wrap.append(menu); pick.setAttribute('aria-expanded', 'true');
    (menu.querySelector('[aria-checked="true"]') || menu.firstChild).focus();
  };
};
// the whole list's title, on the same line the breadcrumb takes when a class or race is open, so opening one moves nothing
const title = (head, root, count) => { head.innerHTML = `<div class="cz-crumbs"><span class="cz-root">${root}</span>${count}</div>`; };
const closeMenus = () => document.querySelectorAll('.cz-menu').forEach((m) => { m.previousElementSibling.setAttribute('aria-expanded', 'false'); m.remove(); });
document.addEventListener('click', (e) => { if (!e.target.closest('.cz-menu')) closeMenus(); });
document.addEventListener('keydown', (e) => {
  const menu = e.target.closest && e.target.closest('.cz-menu');
  if (e.key === 'Escape' && document.querySelector('.cz-menu')) { const p = document.querySelector('.cz-menu').previousElementSibling; closeMenus(); p.focus(); }
  else if (menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const bs = [...menu.querySelectorAll('button')], k = bs.indexOf(e.target);
    bs[(k + (e.key === 'ArrowDown' ? 1 : bs.length - 1)) % bs.length].focus();
  }
});

function draw() {
  if (!has(S.region, S.rules)) S.rules = '';
  if (S.race >= 0 && !raceOn(S.race)) { S.race = -1; const k = open.indexOf('race'); if (k >= 0) open.splice(k, 1); }
  if (S.colRace >= 0 && !raceOn(S.colRace)) S.colRace = -1;
  history.replaceState(history.state, '', link());
  // the Methods and Caveats note on levels, for the region and ruleset picked (both factions)
  const [lt, l60, lmed] = C.levels[S.rules ? S.region + '|' + S.rules : S.region];
  $('czLevels').textContent = `Characters below level 10 aren't counted. ${(l60 / lt * 100).toFixed(1)}% of characters are level 60, and half are level ${lmed} or lower.`;
  document.querySelectorAll('#czRegion button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.region));
  // the ruleset icons (the realm list's own: Normal, PvP, Roleplay, Roleplay PvP), as the flags; greyed where the region has none
  document.querySelectorAll('#czRules button').forEach((b) => { b.setAttribute('aria-pressed', b.dataset.v === S.rules); b.disabled = !has(S.region, b.dataset.v); });
  segs($('czMetric'), METRICS, S.metric, (v) => { S.metric = v; draw(); });
  document.querySelectorAll('.cz-lvl').forEach((el) => segs(el, [['all', 'All'], ['60', '60 Only']], S.level[el.dataset.box], (v) => { S.level[el.dataset.box] = v; draw(); }));
  document.querySelectorAll('#czFaction button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === S.faction));

  // the counts and totals at one box's levels
  const view = (lv) => {
    const g = grid(lv), raceTot = RACES.map((_, i) => g.reduce((a, row) => a + row[i], 0)), classTot = CLASSES.map((_, j) => g[j].reduce((a, b) => a + b, 0));
    return { g, raceTot, classTot, total: raceTot.reduce((a, b) => a + b, 0) };
  };
  // the region, ruleset and faction picked, in the order they're picked in game
  const sel = [S.region !== 'all' && { us: 'NA', eu: 'EU', kr: 'KR', tw: 'TW' }[S.region], S.rules && RULES.find((r) => r[0] === S.rules)[1], S.faction].filter(Boolean);
  // what follows a box's title: the picks and the box's level, then the count: "(NA-PvP-Alliance-Level 60) 473,962", and
  // "small sample" when under 1,000, where shares jump around
  const count = (n, lv) => {
    const w = [...sel, lv === '60' && 'Level 60'].filter(Boolean).join('-');
    return `<span class="cz-count">${w ? `(${w}) ` : ''}${fmt(n)}${n && n < 1000 ? ' · <span class="cz-small">small sample</span>' : ''}</span>`;
  };

  // the classes box: every class, or one class's races
  let { g, raceTot, classTot, total } = view(S.level.cls);
  if (S.cls < 0) {
    title($('czClassHead'), 'Classes', count(total, S.level.cls));
    const P = lastWeek(S.level.cls), pc = P && (S.faction ? P[S.faction.toLowerCase()] : P.classes), pcTot = pc ? pc.reduce((a, b) => a + b, 0) : 0;
    rank($('czClass'), CLASSES.map((name, j) => {
      const tr = argmax(g[j]), mv = move(classTot[j], total, pc ? pc[j] : 0, pcTot, pc && P.week);
      tips['c' + j] = `<div class="h" style="color:${CLASS_COLOR[name]}">${name}</div>` + tipRows([['Characters', fmt(classTot[j])], ['Share', pctTxt(pct(classTot[j], total))],
        ...(mv.row ? [mv.row] : []), ['Most played race', g[j][tr] ? `${RACES[tr]} (${pctTxt(pct(g[j][tr], classTot[j]))})` : '–']]);
      return { key: 'c' + j, name, color: CLASS_COLOR[name], nameColor: CLASS_COLOR[name], img: classImg(j), n: classTot[j], mv: mv.html,
        onClick: () => show('cls', j) };
    }), total);
  } else {
    const j = S.cls, name = CLASSES[j];
    crumbs($('czClassHead'), 'cls', 'Classes', CLASSES.map((c, k) => ({ idx: k, img: classImg(k), name: c, color: CLASS_COLOR[c] })), j, count(classTot[j], S.level.cls));
    rank($('czClass'), RACES.map((rname, i) => {
      tips['cr' + i] = `<div class="h"><span style="color:${FAC_TEXT[FACTION(i)]}">${rname}</span> <span style="color:${CLASS_COLOR[name]}">${name}</span></div>`
        + tipRows([['Characters', fmt(g[j][i])], [`Of ${name}s`, pctTxt(pct(g[j][i], classTot[j]))], [`Of ${RACE_PL[i]}`, pctTxt(pct(g[j][i], raceTot[i]))]]);
      return { key: 'cr' + i, name: rname, ok: raceOn(i) && EXISTS[j][i], color: FAC_COLOR[FACTION(i)], img: raceImg(i), n: g[j][i] };
    }), classTot[j]);
  }

  // the races box: every race, or one race's classes
  ({ g, raceTot, classTot, total } = view(S.level.race));
  if (S.race < 0) {
    title($('czRaceHead'), 'Races', count(total, S.level.race));
    const P = lastWeek(S.level.race), pr = P && P.races.map((n, i) => raceOn(i) ? n : 0), prTot = pr ? pr.reduce((a, b) => a + b, 0) : 0;   // a faction picked: its races' shares among themselves
    rank($('czRace'), RACES.map((name, i) => {
      const col = g.map((row) => row[i]), tc = argmax(col), mv = move(raceTot[i], total, pr ? pr[i] : 0, prTot, pr && P.week);
      tips['r' + i] = `<div class="h" style="color:${FAC_TEXT[FACTION(i)]}">${name}</div>` + tipRows([['Characters', fmt(raceTot[i])], ['Share', pctTxt(pct(raceTot[i], total))],
        ...(mv.row ? [mv.row] : []), ['Most played class', col[tc] ? `${CLASSES[tc]} (${pctTxt(pct(col[tc], raceTot[i]))})` : '–']]);
      return { key: 'r' + i, name, ok: raceOn(i), color: FAC_COLOR[FACTION(i)], img: raceImg(i), n: raceTot[i], mv: mv.html, onClick: () => show('race', i) };
    }), total);
  } else {
    const i = S.race, name = RACES[i];
    crumbs($('czRaceHead'), 'race', 'Races', RACES.map((r, k) => ({ idx: k, img: raceImg(k), name: r, color: FAC_TEXT[FACTION(k)] })).filter((d) => raceOn(d.idx)), i, count(raceTot[i], S.level.race));
    rank($('czRace'), CLASSES.map((cname, j) => {
      tips['rc' + j] = `<div class="h"><span style="color:${FAC_TEXT[FACTION(i)]}">${name}</span> <span style="color:${CLASS_COLOR[cname]}">${cname}</span></div>`
        + tipRows([['Characters', fmt(g[j][i])], [`Of ${RACE_PL[i]}`, pctTxt(pct(g[j][i], raceTot[i]))], [`Of ${cname}s`, pctTxt(pct(g[j][i], classTot[j]))]]);
      return { key: 'rc' + j, name: cname, nameColor: CLASS_COLOR[cname], ok: EXISTS[j][i], color: CLASS_COLOR[cname], img: classImg(j), n: g[j][i] };
    }), raceTot[i]);
  }

  // the faction balance at all levels (the region and ruleset apply): both factions, or once a faction is picked (the
  // split already seen), that faction's bar split by class, largest first
  const all = counts('all'), fa = [0, 0];
  all.forEach((row) => row.forEach((n, i) => { fa[i < 5 ? 0 : 1] += n; }));
  const ft = fa[0] + fa[1], fp = fa.map((n) => pct(n, ft));
  if (S.faction) {
    const f = S.faction, cn = CLASSES.map((_, j) => all[j].reduce((a, n, i) => a + (FACTION(i) === f ? n : 0), 0)), tot = cn.reduce((a, b) => a + b, 0);
    const order = CLASSES.map((_, j) => j).filter((j) => cn[j]).sort((a, b) => cn[b] - cn[a]);
    order.forEach((j) => { tips['b' + j] = `<div class="h"><span style="color:${FAC_TEXT[f]}">${f}</span> <span style="color:${CLASS_COLOR[CLASSES[j]]}">${CLASSES[j]}</span></div>` + tipRows([['Characters', fmt(cn[j])], [`Of ${f}`, pctTxt(pct(cn[j], tot))]]); });
    $('czBal').innerHTML = `<img src="images/icons/faction_${f.toLowerCase()}.jpg" alt="${f}"><div class="cz-balwrap"><div class="cz-balbar">`
      + order.map((j) => `<i class="seg" data-tip="b${j}" style="width:${pct(cn[j], tot)}%;background:${soft(CLASS_COLOR[CLASSES[j]])}">${pct(cn[j], tot) >= 4 ? pctTxt(pct(cn[j], tot)) : ''}</i>`).join('')
      + `</div></div><span></span><div class="cz-ballab"><span><b style="color:${FAC_TEXT[f]}">${f}</b><b>${fp[f === 'Alliance' ? 0 : 1].toFixed(1)}%</b><em>(${fmt(tot)})</em></span></div>`;
  } else $('czBal').innerHTML = `<img src="images/icons/faction_alliance.jpg" alt="Alliance"><div class="cz-balwrap"><div class="cz-balgrid">${[0, 25, 50, 75, 100].map((t) => `<i class="${t === 50 ? 'mid' : ''}" style="left:${t}%"></i>`).join('')}</div><div class="cz-balbar"><i style="width:${fp[0]}%;background:${soft('var(--al)')}"></i><i style="width:${fp[1]}%;background:${soft('var(--ho)')}"></i><b style="left:${fp[0]}%"></b></div><div class="cz-balmid"></div></div>`
    + `<img src="images/icons/faction_horde.jpg" alt="Horde"><div class="cz-ballab"><span><b style="color:${FAC_TEXT.Alliance}">Alliance</b><b>${fp[0].toFixed(1)}%</b><em>(${fmt(fa[0])})</em></span>`
    + `<span><em>(${fmt(fa[1])})</em><b>${fp[1].toFixed(1)}%</b><b style="color:${FAC_TEXT.Horde}">Horde</b></span></div>`;

  ({ g, raceTot, classTot, total } = view(S.level.table));
  table(g, raceTot, classTot, total);
}

// The race x class table, as the Sims page's "DPS by Race and Spec": each cell shaded by where it sits in its column
// (palest to darkest blue), the column's biggest in bold with a gold mark. A class's header sorts the races by it
// (again to flip, a third time for the usual order); a race orders the classes by its own numbers, biggest first.
function table(g, raceTot, classTot, total) {
  const val = (j, i) => {
    const n = g[j][i];
    return S.metric === 'col' ? pct(n, classTot[j]) : S.metric === 'row' ? pct(n, raceTot[i]) : S.metric === 'all' ? pct(n, total) : n;
  };
  const allv = (i) => S.metric === 'row' ? 100 : S.metric === 'n' ? raceTot[i] : pct(raceTot[i], total);
  const cell = (v) => S.metric === 'n' ? fmt(v) : pctTxt(v);
  let rows = RACES.map((_, i) => i).filter(raceOn).sort((a, b) => raceTot[b] - raceTot[a]);
  if (S.sort === 'race') rows.sort((a, b) => RACES[a].localeCompare(RACES[b]) * (S.sortDir === 'asc' ? 1 : -1));
  else if (S.sort === 'all') rows.sort((a, b) => (allv(b) - allv(a)) * (S.sortDir === 'asc' ? -1 : 1));
  else if (S.sort != null) { const j = S.sort; rows.sort((a, b) => (EXISTS[j][b] - EXISTS[j][a]) || (val(j, b) - val(j, a)) * (S.sortDir === 'asc' ? -1 : 1)); }
  let cols = CLASSES.map((_, j) => j);
  if (S.colRace >= 0) { const i = S.colRace; cols.sort((a, b) => (EXISTS[b][i] - EXISTS[a][i]) || val(b, i) - val(a, i)); }
  const best = {}, ext = {};
  for (const j of cols) {
    const v = rows.filter((i) => EXISTS[j][i] && g[j][i]).map((i) => val(j, i));
    if (v.length) { best[j] = Math.max(...v); ext[j] = [Math.min(...v), Math.max(...v)]; }
  }
  const sortAttr = (k) => S.sort === k ? ` aria-sort="${S.sortDir === 'asc' ? 'ascending' : 'descending'}"` : '';
  $('czTable').tHead.innerHTML = `<tr><th class="t"${sortAttr('race')}><button type="button" data-sort="race">Race</button></th>`
    + cols.map((j) => `<th${sortAttr(j)}><button type="button" data-sort="${j}" style="color:${soft(CLASS_COLOR[CLASSES[j]])}">${CLASSES[j]}</button></th>`).join('')
    + `<th${sortAttr('all')}><button type="button" data-sort="all">All</button></th></tr>`;
  $('czTable').tBodies[0].innerHTML = rows.map((i) => `<tr><td class="r${S.colRace === i ? ' picked' : ''}" data-race="${i}" tabindex="0" role="button">${raceImg(i)}${RACES[i]}</td>`
    + cols.map((j) => {
      if (!EXISTS[j][i]) return '<td></td>';
      const v = val(j, i), n = g[j][i], [lo, hi] = ext[j] || [0, 0], t = hi > lo ? (v - lo) / (hi - lo) : 1;
      tips[`t${j}_${i}`] = `<div class="h"><span style="color:${FAC_TEXT[FACTION(i)]}">${RACES[i]}</span> <span style="color:${CLASS_COLOR[CLASSES[j]]}">${CLASSES[j]}</span></div>`
        + tipRows([['Characters', fmt(n)], [`Of ${CLASSES[j]}s`, pctTxt(pct(n, classTot[j]))], [`Of ${RACE_PL[i]}`, pctTxt(pct(n, raceTot[i]))], ['Of everyone', pctTxt(pct(n, total))]]);
      return `<td class="${n && v === best[j] ? 'top best' : ''}" data-tip="t${j}_${i}" style="background:color-mix(in srgb, var(--accent) ${Math.round(6 + t * 34)}%, transparent)">${cell(v)}</td>`;
    }).join('')
    + `<td class="tot">${cell(allv(i))}</td></tr>`).join('');
  $('czTable').tHead.onclick = (e) => {
    const b = e.target.closest('[data-sort]'); if (!b) return;
    const k = b.dataset.sort === 'race' || b.dataset.sort === 'all' ? b.dataset.sort : +b.dataset.sort;
    if (S.sort !== k) { S.sort = k; S.sortDir = k === 'race' ? 'asc' : 'desc'; }
    else if (S.sortDir === (k === 'race' ? 'asc' : 'desc')) S.sortDir = k === 'race' ? 'desc' : 'asc';
    else S.sort = null;   // a third click: back to the usual order (most played race first)
    draw();
  };
  const pick = (td) => { const i = +td.dataset.race; S.colRace = S.colRace === i ? -1 : i; draw(); };
  $('czTable').tBodies[0].onclick = (e) => { const td = e.target.closest('td.r'); if (td) pick(td); };
  $('czTable').tBodies[0].onkeydown = (e) => { const td = e.target.closest('td.r'); if (td && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(td); } };
  fit();
}

// The table's size: its text and cells as big as the box's width allows without a sideways scrollbar, 1.2 times at
// most (the Sims page's matrix_fit.js).
const tbl = $('czTable'), wrap = tbl.parentElement, card = tbl.closest('section');
function fit() {
  if (!wrap.clientWidth) return;
  const scale = parseFloat(card.style.getPropertyValue('--mz')) || 1, prev = tbl.style.width;
  tbl.style.width = 'max-content';
  const w = tbl.offsetWidth / scale;
  tbl.style.width = prev;
  if (!w) return;
  const v = Math.max(1, Math.min(1.2, Math.floor(((wrap.clientWidth - 2) / w) * 100) / 100));
  if (Math.abs(v - scale) > 0.005) { card.style.setProperty('--mz', String(v)); $('czBal').style.setProperty('--mz', String(v)); }   // the faction names match the table's class names
}
new ResizeObserver(fit).observe(wrap);

$('czNotesCard').querySelector('.cz-fold').onclick = (e) => {
  const open = !$('czNotesCard').classList.toggle('collapsed');
  e.currentTarget.setAttribute('aria-expanded', String(open));
  e.currentTarget.setAttribute('aria-label', (open ? 'Collapse' : 'Expand') + ' Methods and Caveats');
};
document.addEventListener('click', (e) => {
  // the crests, the flags and the ruleset icons: pick one to show only it, pick it again for all
  const f = e.target.closest('#czFaction button'); if (f) { S.faction = S.faction === f.dataset.v ? '' : f.dataset.v; draw(); return; }
  const r = e.target.closest('#czRegion button'); if (r) { S.region = S.region === r.dataset.v ? 'all' : r.dataset.v; draw(); return; }
  const u = e.target.closest('#czRules button'); if (u && !u.disabled) { S.rules = S.rules === u.dataset.v ? '' : u.dataset.v; draw(); }
});
draw();
})();
</script>
